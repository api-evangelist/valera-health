aid: valera-health
name: Valera Health
description: 'Valera Health is a Brooklyn, New York based virtual behavioral health
  provider delivering therapy, psychiatry, group therapy, comprehensive Dialectical
  Behavior Therapy (DBT), suicide care and youth support programs to adults and children
  through an in-house clinical team, a care-coordinator model and a patient mobile
  app. It is a care-delivery organization rather than a software vendor: revenue comes
  from commercial insurance, Medicaid and Medicare reimbursement, and the clinical
  record and patient portal run on third-party health IT (the patient portal is operated
  by NextGen Healthcare at pxpportal.nextgen.com). As of this profile Valera Health
  publishes no developer program, no public API reference, and no machine-readable
  contract of any kind; its only externally addressable API host, api.valerahealth.com,
  is the private backend for its own patient application.'
